# Netlify: Next.js 16 runs through Netlify's Next.js adapter (OpenNext), detected automatically.
# Required environment variables (Site settings > Environment variables), never committed:
#   NEXT_PUBLIC_SITE_URL, NEXT_PUBLIC_FIREBASE_API_KEY, NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN,
#   NEXT_PUBLIC_FIREBASE_PROJECT_ID, NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET, NEXT_PUBLIC_FIREBASE_APP_ID,
#   FIREBASE_CLIENT_EMAIL, FIREBASE_PRIVATE_KEY (mark both as secret), REVIEW_HASH_SECRET
#   (functions share a 4 KB env budget, so use the two small vars, not the base64 JSON)
#   (optional) NEXT_PUBLIC_TURNSTILE_SITE_KEY, TURNSTILE_SECRET_KEY
# The build prerenders the menu, so it needs the production Firestore (already seeded) to be reachable.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
